name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/tuprwre

  integration:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make test-integration

  # The report pipeline e2e is fixture-driven: it needs no live Tetragon, no
  # eBPF and no pi harness, so it runs here. The gateway e2e
  # (scripts/gateway-e2e.sh) drives a real pi harness and stays out of CI.
  report-e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: bash scripts/report-e2e.sh
